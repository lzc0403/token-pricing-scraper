# LLM Token 定价数据源配置
# 字段说明：
#   id       : 源唯一标识，会写入每条记录（内部 id，不要改）
#   name     : 人类可读中文/品牌展示名（网页展示优先走 core/site.py SOURCE_LABELS）
#   url      : 主抓取 URL（部分源有多个，用 urls 列表）
#   urls     : 多 URL 列表（kimi 用）
#   parser   : scrapers 下对应的 parser 模块名（不含 .py）
#   currency : 该源货币，CNY / USD
#   js       : 是否需要浏览器渲染（SPA / JS 动态渲染的页面为 true；静态文档为 false）
#   region   : 区域过滤（tencent 仅取 mainland 区域表）
#   fallback_url : 主 URL 失效时的回退地址（aliyun 用）
#   note     : 备注
- id: aliyun
  name: 阿里云
  url: https://help.aliyun.com/zh/hologres/user-guide/managed-models-billing
  parser: aliyun
  currency: CNY
  js: false
  note: >-
    Hologres 托管模型计费（中国站）。单表五列：输入 / 显式缓存创建 / 显式缓存命中 /
    隐式缓存命中 / 输出，单位「元/千 Token」。解析时仅取中国内地区域（北京/上海/杭州/深圳），
    缓存命中只取「隐式缓存命中」列，并按站点统一的「元/百万 Token」口径 ×1000。

- id: aliyun_intl
  name: 阿里云国际站
  url: https://modelstudio.console.alibabacloud.com/ap-southeast-1?tab=doc#/doc/?type=model&url=prices
  parser: aliyun_intl
  currency: USD
  js: true
  note: >-
    Model Studio 国际站（新加坡 ap-southeast-1），USD 结算。定价表含 Qwen / DeepSeek /
    Kimi / GLM 等模型，单位「美元/百万 tokens」，含隐式缓存命中价。SPA 控制台需浏览器渲染。
    与国内站（CNY，阿里云）区分展示，便于对比同模型国内外价格。

- id: aliyun_bailian
  name: 阿里云百炼
  url: https://help.aliyun.com/help/json/document_detail.json?alias=%2Fmodel-studio%2Fmodel-pricing&pageNum=1&pageSize=20&website=cn&language=zh
  parser: bailian
  currency: CNY
  js: false
  note: >-
    阿里云百炼（国内站 cn-beijing）模型调用计费文档。控制台入口
    bailian.console.aliyun.com/cn-beijing?tab=doc#/doc/?type=model&url=2987148
    （doc id 2987148 = /model-studio/model-pricing）。静态帮助 JSON 含全量定价表
    （元/百万 tokens）。仅取国内（全球/大陆）价，跳过「国际/美国/日本」区域行。
    缓存命中价按用户给定规则 = 输入单价 × 20% 计算（页面仅标注「上下文缓存享有折扣」）。
    覆盖 DeepSeek / GLM / Kimi / MiniMax 等转售模型；Qwen 仍由 aliyun（Hologres）源负责。

- id: volcengine
  name: 火山引擎
  url: https://docs.volcengine.com/docs/82379/1544106?redirect=1&lang=zh
  parser: volcengine
  currency: CNY
  js: true

- id: volcengine_intl
  name: 火山云海外
  url: https://docs.byteplus.com/en/docs/ModelArk/1544106
  parser: volcengine_intl
  currency: USD
  js: true
  note: >-
    BytePlus ModelArk 海外站（docs.byteplus.com，USD 结算）。仅抓「大语言模型 - 在线推理(标准)」表，
    收录 DeepSeek（v4-pro/v4-flash/v3.2）+ GLM（glm-5-2/glm-4-7）系列。模型名剥离日期快照后缀
    （-260425/-251201/-260617/-251222）归一到无后缀基准名。DeepSeek 来源类型按规则标
    「火山引擎自部署」（页面无「原厂直供」标记）。与国内火山引擎（CNY）区分展示。

- id: tencent
  name: 腾讯云
  url: https://www.tencentcloud.com/zh/document/product/1300/78937
  parser: tencent
  currency: USD
  region: mainland          # 只取「广州/中国大陆」区域表，忽略「新加坡」等海外区域
  js: true                 # 文档为 SPA，静态 HTML 无表格，需浏览器渲染

- id: tencent_cn
  name: 腾讯云
  url: https://cloud.tencent.com/document/product/1823/130055
  parser: tencent_cn
  currency: CNY
  js: true
  note: >-
    腾讯云大模型服务平台 TokenHub 模型价格（国内站 cloud.tencent.com，CNY）。
    语言模型表含「推理输入/推理输出/缓存命中」（元/百万 tokens），每个模型分
    「原厂直供」与「腾讯云自建」两档，用 condition 字段区分。
    与 tencent（国际站 tencentcloud.com，USD）区分展示，国内渠道面板由此源补充。

- id: bigmodel
  name: 智谱
  url: https://open.bigmodel.cn/pricing
  parser: bigmodel
  currency: CNY
  js: true
  note: 智谱国内站（open.bigmodel.cn，CNY）。与 `zai`（国际站 docs.z.ai，USD）区分展示。

- id: zai
  name: 智谱Z.ai
  url: https://docs.z.ai/guides/overview/pricing
  parser: zai
  currency: USD
  js: false
  note: 智谱海外站 Z.AI（docs.z.ai，USD 结算）官方定价页。取 Latest Models + Text Models 两张文本表，收录 GLM 系列（GLM-5.3 / GLM-5.3-Flash / 5.2 / 5.1 / 5 / 4.7 …）。页面限时促销以 `<del>原价</del> 促销价` 呈现，解析器排除 `<del>` 取实际扣费价（与 OpenRouter 一致）。

- id: deepseek
  name: DeepSeek
  url: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
  parser: deepseek
  currency: CNY
  js: false
  note: DeepSeek 官网中文站，人民币（¥/百万 tokens）计费。与 `deepseek_us`（英文站 USD）并列展示，保留原计费币种作为官网标价。

- id: deepseek_us
  name: DeepSeek (US)
  url: https://api-docs.deepseek.com/quick_start/pricing/
  parser: deepseek
  currency: USD
  js: false
  note: DeepSeek 官网英文站，美元（$/百万 tokens）计费。与 `deepseek`（中文站 CNY）并列展示，保留原计费币种作为官网标价。

- id: minimax
  name: MiniMax
  url: https://platform.minimaxi.com/subscribe/token-plan?tab=api-enterprise
  parser: minimax
  currency: CNY
  js: true

- id: kimi
  name: Kimi
  urls:
    - https://platform.kimi.com/docs/pricing/chat-k3
    - https://platform.kimi.com/docs/pricing/chat-k26
    - https://platform.kimi.com/docs/pricing/chat-k25
    - https://platform.kimi.com/docs/pricing/chat-k27-code
  parser: kimi
  currency: CNY
  js: true
  note: >-
    Kimi 官方中文站（platform.kimi.com，CNY 结算），模型定价入口
    /docs/pricing/chat。各模型子页（chat-k3 / chat-k26 / chat-k25 /
    chat-k27-code）为定义式表格：模型 / 计费单位 / 输入价格（缓存命中）/
    输入价格（缓存未命中）/ 输出价格 / 上下文窗口。与 kimi_ai（国际站 USD）区分展示。

- id: kimi_ai
  name: Kimi国际站
  url: https://platform.kimi.ai/docs/pricing/chat
  urls:
    - https://platform.kimi.ai/docs/pricing/chat-k3
    - https://platform.kimi.ai/docs/pricing/chat-k26
    - https://platform.kimi.ai/docs/pricing/chat-k25
    - https://platform.kimi.ai/docs/pricing/chat-k27-code
  parser: kimi
  currency: USD
  js: true
  note: >-
    Kimi 官方国际站（platform.kimi.ai，USD 结算），模型定价入口
    /docs/pricing/chat。子页结构与中文站一致，表头为英文（Model / Unit /
    Input Price (Cache Hit) / Input Price (Cache Miss) / Output Price /
    Context Window），解析器已兼容双语表头。与 kimi（国内站 CNY）区分展示。

- id: modelmesh
  name: 胜算云
  url: https://global.modelmesh.info/model
  parser: modelmesh
  currency: CNY
  js: true


- id: openai
  name: OpenAI
  url: https://developers.openai.com/api/docs/pricing
  parser: openai
  currency: USD
  js: false
  note: >-
    OpenAI 官方定价页（developers.openai.com，USD）。页面为 Astro 预渲染，
    价格数据在 TextTokenPricingTables 组件的 props JSON 内。取 standard 档
    （默认展示档位），收录 GPT-5.5 / GPT-5.5-Pro / GPT-5.6 Sol·Terra·Luna，
    旗舰区（5.6 系列）区分短文本（≤272K）与长文本（>272K）双档价格。
    canonical 由 openrouter.yml 白名单同 id 映射（source=openai 特殊通道）。

- id: openrouter
  name: OpenRouter
  url: https://openrouter.ai/api/v1/models?sort=top-weekly
  parser: openrouter
  currency: USD
  js: false
  cache_path: data/openrouter_raw.json
  rules_path: config/openrouter.yml
  note: 公开 Models API，自动缓存 JSON 并二次验证；收录热门白名单 + top-weekly 补充

- id: atlascloud
  name: AtlasCloud
  url: https://console.atlascloud.ai/api/v1/models
  parser: atlascloud
  currency: USD
  js: false
  cache_path: data/atlascloud_raw.json
  note: >-
    AtlasCloud（atlascloud.ai）AI 网关，OpenAI 兼容。稳定 JSON API 返回全量模型，
    取 type=Text 的 LLM 模型，价格为「美元/百万 tokens」。与 OpenRouter 同类，作为渠道源展示，
    便于与官网/官方价、其他渠道价横向对比（此前误归到 OpenRouter 的报价即来自此源）。
