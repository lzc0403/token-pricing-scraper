name: CI Lint & Test

on:
  push:
    paths:
      - 'core/**'
      - 'scrapers/**'
      - 'tests/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Install Playwright Chromium
        # 部分 scraper 测试走 playwright 真实渲染（如 tencent_cn / volcengine_intl）
        run: playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check core/ scrapers/ tests/ main.py
      - name: Type check (mypy)
        run: python -m mypy core/ scrapers/ main.py
      - name: Test (pytest)
        run: pytest tests/ -q