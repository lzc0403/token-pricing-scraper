name: Token Pricing Scraper

on:
  schedule:
    - cron: '0 17 * * *'      # 每天 17:00 UTC = 北京时间次日 01:00（凌晨1点）
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 曾因 15 分钟超时卡死在 Install Playwright Chromium，加到 30 分钟
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Type check (mypy)
        run: python -m mypy core main.py
      - name: Install Playwright Chromium
        # 从微软 CDN 下载约 100MB，美国节点可能慢；本地已有缓存则秒过
        run: playwright install --with-deps chromium
      - name: Run scraper
        id: scrape
        # ⛔ 门禁：main.py 检测到 Tier1 high 级数据错误会以非零码退出，
        # 这里不再 continue-on-error，失败直接中止 workflow，不部署坏数据。
        run: python main.py
        env:
          USD_CNY_RATE: ${{ secrets.USD_CNY_RATE }}
      - name: Commit results
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          git commit -m "chore: daily pricing update $(date +%F)" || echo "no changes"
          git push
      - name: Open issue on price change
        if: steps.scrape.outcome == 'success' && steps.scrape.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "🔔 Token 定价变动 $(date +%F)" --body-file data/issue_body.md --label pricing
      - name: Alert issue on data gate failure
        # 门禁拦截时开 issue 告警，提醒人工处理，而不是静默吞掉坏数据
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/audit_report.md ]; then
            gh issue create --title "⛔ 数据门禁拦截 $(date +%F)" --body-file data/audit_report.md --label pricing
          else
            gh issue create --title "⛔ 抓取失败 $(date +%F)" --body "main.py 运行失败，数据未更新，需人工排查。" --label pricing
          fi
      - name: Upload Pages artifact
        if: steps.scrape.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
